<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amazon Jungle Adventure</title><style>

:root{font-family:Outfit,'Noto Sans Thai',sans-serif;color:#163e32;background:#edf2df}*{box-sizing:border-box}body{margin:0}header{padding:20px 5%;display:flex;justify-content:space-between;align-items:center;background:#fff8e9;border-bottom:1px solid #d8ddc9}.brand{font-weight:800;letter-spacing:1px}button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 22px;background:#164e3e;color:white;font-weight:600}button:focus-visible{outline:4px solid #d89322;outline-offset:4px}button:disabled{cursor:default}main{max-width:1180px;margin:auto;padding:30px 24px}.eyebrow{text-transform:uppercase;letter-spacing:3px;font-size:12px;font-weight:800;color:#58725b}h1{font-size:clamp(34px,5vw,64px);line-height:1.04;margin:15px 0}h2{font-size:30px}.intro{max-width:680px;line-height:1.8}.layout{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:start}.scene{position:relative;border-radius:30px;overflow:hidden;background:#a5d5b7;min-height:440px;box-shadow:0 18px 40px #164e3e16}.scene svg{width:100%;height:440px;display:block}.scene-label{position:absolute;left:24px;top:22px;background:#fff9de;padding:9px 15px;border-radius:30px;font-weight:700;font-size:13px}.animal{animation:sway 4s ease-in-out infinite;transform-origin:center}.boat{animation:sway 3s ease-in-out infinite}.birds{animation:fly 8s linear infinite}@keyframes sway{50%{transform:translateY(-6px) rotate(1deg)}}@keyframes fly{50%{transform:translateX(24px)}}.panel{padding:28px;background:#fffaf0;border-radius:26px;border:1px solid #dbe1cb}.hud{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:700;margin-bottom:14px}.bar{height:8px;border-radius:20px;background:#dfe6d7;margin-bottom:26px;overflow:hidden}.bar div{height:100%;background:#e8b64a;transition:width .4s}.story{color:#587262;font-size:17px;line-height:1.65}.sentence{font-size:25px;line-height:1.5;margin:22px 0}.blank{color:#b3791d;border-bottom:3px dashed #d9b65e}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{background:white;color:#214b3b;border:2px solid #dce4d4;text-align:left;padding:18px}.choice:hover:not(:disabled){border-color:#719878;background:#eef4e8}.choice.good{background:#d7efda;border-color:#579963}.choice.bad{background:#ffead7;border-color:#d6a46e}.feedback{padding:18px;border-radius:16px;background:#eaf1df;line-height:1.7;margin-top:20px}.feedback strong{display:block}.next{width:100%;margin-top:14px;background:#e9ba51;color:#253c2c}.rules{font-size:14px;background:#e2ead6;padding:18px;border-radius:14px;line-height:1.9;margin:20px 0}.tags{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tags span{background:#e2ead6;border-radius:30px;padding:8px 13px;font-size:12px}.score{font-size:70px;font-weight:800;margin:12px 0;color:#1d634b}.review{padding:14px 0;border-top:1px solid #dce4d4;font-size:14px;line-height:1.8}.muted{color:#657c6a;font-size:13px}footer{text-align:center;color:#657c6a;font-size:12px;padding:22px}.hint{font-size:13px;color:#74816c}.hidden{display:none}@media(max-width:780px){.layout{grid-template-columns:1fr}.scene,.scene svg{min-height:250px;height:280px}main{padding:22px 16px}.panel{padding:22px}header{padding:16px}h1{font-size:40px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><header><div class="brand">🌿 AMAZON / ADVENTURE</div><button id="sound" aria-pressed="false">♫ เปิดเสียง</button></header><main><div class="eyebrow">ENGLISH EXPEDITION · M.3 · A2+ / B1</div><h1>Amazon Jungle<br>Adventure<span style="color:#bf8a26">.</span></h1><div class="layout"><div><div class="scene" id="scene"></div><div class="tags"><span>🌳 Dense Jungle / 5 missions</span><span>🛶 Long River / 5 missions</span></div><p class="hint">Explore the rainforest. Find the right words. Reach the explorer’s camp.</p></div><section class="panel" id="game" aria-live="polite"></section></div></main><footer>Learn bravely. Every answer is a step forward. • Amazon Grammar Expedition</footer><script>
const questions=[
{story:'You step into the rainforest. A jaguar watches from behind a tree. Choose a word to describe the animal.',sentence:'A ___ jaguar stands beside the trail.',a:['fearsomely','fearsome'],c:1,noun:'jaguar',word:'fearsome',why:'fearsome เป็น adjective แปลว่า น่าเกรงขาม ใช้ขยายคำนาม jaguar ส่วน fearsomely เป็น adverb จึงไม่ใช้ขยายคำนามนี้',icon:'🐆'},
{story:'Sunlight barely reaches the ground. Huge trees surround you on every side.',sentence:'We walk through the ___ forest.',a:['dense','densely'],c:0,noun:'forest',word:'dense',why:'dense เป็น adjective แปลว่า หนาทึบ ขยายคำนาม forest ส่วน densely เป็น adverb เช่น Trees grow densely.',icon:'🌳'},
{story:'A frog sits on a leaf. Your guide warns you: do not touch it!',sentence:'That ___ frog may make you ill if you touch it.',a:['poisonously','poisonous'],c:1,noun:'frog',word:'poisonous',why:'poisonous เป็น adjective แปลว่า มีพิษ ขยายคำนาม frog ส่วน poisonously เป็น adverb ไม่ใช้ขยายนาม frog',icon:'🐸'},
{story:'A tropical storm has just passed. You look for a place to rest before moving on.',sentence:'We find a ___ place under a large rock.',a:['safe','safely'],c:0,noun:'place',word:'safe',why:'safe เป็น adjective แปลว่า ปลอดภัย ใช้ขยายคำนาม place ส่วน safely เป็น adverb เช่น We arrive safely.',icon:'🪨'},
{story:'You reach the river. A wooden bridge leads to your canoe, but some boards are broken.',sentence:'The ___ bridge needs repairs.',a:['dangerously','dangerous'],c:1,noun:'bridge',word:'dangerous',why:'dangerous เป็น adjective ขยายคำนาม bridge บอกว่าสะพานอันตราย ส่วน dangerously ใช้ขยายการกระทำ เช่น The bridge shakes dangerously.',icon:'🌉'},
{story:'River mission begins! A fallen tree blocks part of the river. Steer your canoe around it.',sentence:'You steer the canoe ___.',a:['careful','carefully'],c:1,verb:'steer',word:'carefully',why:'steer เป็นกริยา ต้องใช้ adverb carefully เพื่อบอกว่าบังคับเรืออย่างระมัดระวัง เปลี่ยน careful เป็น carefully โดยเติม -ly',icon:'🛶'},
{story:'Dark clouds gather. You must reach the sheltered riverbank before the storm arrives.',sentence:'We paddle ___ to reach the riverbank in time.',a:['quickly','quick'],c:0,verb:'paddle',word:'quickly',why:'quickly เป็น adverb ขยายกริยา paddle บอกว่าพายอย่างรวดเร็ว ส่วน quick เป็น adjective เช่น a quick journey',icon:'⛈️'},
{story:'You hear birds nesting near the water. Avoid disturbing them as you pass.',sentence:'We speak ___ near the nesting birds.',a:['quiet','quietly'],c:1,verb:'speak',word:'quietly',why:'ใช้ quietly เป็น adverb ขยาย speak บอกว่าพูดอย่างเบา ๆ โดยเติม -ly หลัง quiet ซึ่งเป็น adjective',icon:'🦜'},
{story:'A narrow channel appears ahead. Your guide smiles: your paddling skills are improving!',sentence:'You handle the canoe ___.',a:['well','good'],c:0,verb:'handle',word:'well',why:'well เป็น adverb ของ good ใช้ขยายกริยา handle แปลว่าควบคุมได้ดี ข้อนี้เป็นรูปพิเศษ ไม่ใช้ goodly ส่วน good เป็น adjective เช่น a good explorer',icon:'🌊'},
{story:'The explorer’s camp is close! The current grows stronger, so keep up your speed.',sentence:'Our canoe moves ___ toward the camp.',a:['fastly','fast'],c:1,verb:'moves',word:'fast',why:'fast เป็นได้ทั้ง adjective และ adverb ในประโยคนี้ขยายกริยา moves จึงเป็น adverb และไม่ต้องเติม -ly คำว่า fastly ไม่ใช่รูปที่ถูกต้อง',icon:'🏕️'}];
let i=0,score=0,answers=[],locked=false,audioOn=false,ctx,timer;const game=document.getElementById('game');
function art(river=false){document.getElementById('scene').innerHTML='<div class="scene-label">'+(river?'02 / THE LONG RIVER':'01 / THE DENSE JUNGLE')+'</div><svg viewBox="0 0 600 440" role="img" aria-label="Colorful illustrated Amazon rainforest with river and explorer"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#c4e3b2"/><stop offset="1" stop-color="#62a88c"/></linearGradient></defs><rect width="600" height="440" fill="url(#sky)"/><circle cx="380" cy="90" r="55" fill="#fff0a8"/><path d="M0 260Q60 100 140 260Q240 80 330 255Q470 90 600 245V440H0" fill="#45866a"/><path d="M0 315Q160 240 280 295T600 290V440H0" fill="#286e51"/><path d="M300 260Q240 300 370 345Q440 370 220 440H560Q600 370 435 335Q340 310 365 260" fill="#71cfcb"/><path d="M305 298l55 0m20 48l70 0m-80 44l90 0" stroke="#d5f4dc" stroke-width="4" stroke-linecap="round"/><g fill="#194e3e"><path d="M30 0H65L88 440H20Z"/><path d="M520 0H550L590 440H540Z"/></g><g fill="#2a7650"><ellipse cx="60" cy="25" rx="135" ry="65"/><ellipse cx="515" cy="25" rx="150" ry="80"/><ellipse cx="10" cy="100" rx="75" ry="55"/></g><path d="M150 0Q115 120 170 200M470 0Q440 100 482 170" stroke="#205e42" fill="none" stroke-width="6"/><g class="birds" stroke="#143f33" stroke-width="4" fill="none"><path d="M270 95q10-12 20 0q10-12 20 0M310 128q8-10 16 0q8-10 16 0"/></g><g class="animal"><ellipse cx="178" cy="333" rx="57" ry="27" fill="#efb641"/><circle cx="221" cy="314" r="25" fill="#efb641"/><circle cx="205" cy="293" r="9" fill="#d99732"/><circle cx="233" cy="293" r="9" fill="#d99732"/><path d="M126 337Q76 300 95 284" stroke="#efb641" stroke-width="12" fill="none"/><path d="M146 346v26m53-27v27" stroke="#efb641" stroke-width="13"/><g fill="#6f4c27"><circle cx="150" cy="325" r="5"/><circle cx="172" cy="340" r="4"/><circle cx="190" cy="322" r="5"/><circle cx="213" cy="311" r="3"/><circle cx="234" cy="311" r="3"/></g><ellipse cx="226" cy="324" rx="9" ry="6" fill="#fff0bb"/></g><g class="boat" '+(river?'':'opacity=".7"')+'><path d="M370 354Q418 390 477 354Z" fill="#c77942"/><circle cx="423" cy="325" r="14" fill="#fac991"/><path d="M407 343v-9q15-15 30 0v9" fill="#f1d86d"/><ellipse cx="423" cy="313" rx="24" ry="6" fill="#f1d86d"/><path d="M440 329l-45 51" stroke="#804c2f" stroke-width="5"/></g><g fill="#84b961"><ellipse cx="35" cy="418" rx="75" ry="28"/><ellipse cx="565" cy="420" rx="90" ry="35"/></g><g fill="#f2bd63"><circle cx="50" cy="392" r="9"/><circle cx="551" cy="390" r="10"/></g></svg>';}
function tone(f=500,d=.12,vol=.035){if(!audioOn||!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=f;g.gain.setValueAtTime(vol,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.start();o.stop(ctx.currentTime+d)}
document.getElementById('sound').onclick=()=>{audioOn=!audioOn;if(audioOn){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let beat=0;timer=setInterval(()=>{tone([196,247,294,247][beat++%4],.35,.012);if(beat%4===0){tone(1500,.15,.01);setTimeout(()=>tone(1800,.1,.008),180)}},450)}else clearInterval(timer);document.getElementById('sound').textContent=audioOn?'♫ ปิดเสียง':'♫ เปิดเสียง';document.getElementById('sound').setAttribute('aria-pressed',audioOn)};
function welcome(){art();game.innerHTML='<div class="eyebrow">YOUR EXPEDITION STARTS HERE</div><h2>Welcome, explorer! 🧭</h2><p class="story">Deep in the Amazon, a hidden camp is waiting. Cross the dense jungle, navigate the long river, and let the right words guide your way.</p><div class="rules">🎯 เป้าหมาย: เลือก Adjective และ Adverb ให้เหมาะกับประโยค<br>🌳 ด่าน 1 ป่าทึบ: Adjectives ขยายคำนาม 5 ข้อ<br>🛶 ด่าน 2 แม่น้ำสายยาว: Adverbs ขยายกริยา 5 ข้อ<br>⭐ ถูก +10 คะแนน • ผิด 0 คะแนน • เต็ม 100<br>ตอบทีละข้อ อ่านคำอธิบาย แล้วกดไปต่อ คำตอบแรกเท่านั้นที่คิดคะแนน ไม่มีการจับเวลา</div><button class="next" onclick="start()">Start the adventure →</button><p class="muted">เสียงสังเคราะห์ดนตรีและนกร้อง: เปิดได้จากปุ่มด้านบน<br>คำอธิบายวิเคราะห์ตามตัวเลือกที่เตรียมไว้ ไม่ได้เชื่อม AI ออนไลน์</p>';}
function start(){i=0;score=0;answers=[];render()}
function render(){locked=false;art(i>=5);let q=questions[i];game.innerHTML='<div class="hud"><span>'+(i<5?'🌳 ด่าน 1: ป่าทึบ':'🛶 ด่าน 2: แม่น้ำสายยาว')+'</span><span>คะแนน '+score+' / 100</span></div><div class="bar"><div style="width:'+i*10+'%"></div></div><div class="eyebrow">MISSION '+(i+1)+' OF 10 · '+(i<5?'ADJECTIVES':'ADVERBS')+'</div><h2>'+q.icon+' '+['The Watchful Jaguar','Into the Green','Look, Don’t Touch','A Safe Shelter','The Broken Bridge','Steer with Care','Beat the Storm','Respect the Birds','A Skilled Explorer','Reach the Camp'][i]+'</h2><p class="story">'+q.story+'</p><p class="sentence">'+q.sentence.replace('___','<span class="blank">&nbsp; ? &nbsp;</span>')+'</p><div class="choices">'+q.a.map((a,j)=>'<button class="choice" onclick="answer('+j+')">'+String.fromCharCode(65+j)+' &nbsp; '+a+'</button>').join('')+'</div><div id="feedback"></div>';}
function answer(j){if(locked)return;locked=true;const q=questions[i],ok=j===q.c;answers.push({j,ok});if(ok)score+=10;tone(ok?880:300,.25);document.querySelectorAll('.choice').forEach((b,k)=>{b.disabled=true;if(k===q.c)b.classList.add('good');else if(k===j)b.classList.add('bad')});document.querySelector('.hud span:last-child').textContent='คะแนน '+score+' / 100';document.querySelector('.bar div').style.width=(i+1)*10+'%';document.getElementById('feedback').innerHTML='<div class="feedback"><strong>'+(ok?['Brilliant, jungle explorer! 🌿','Great work! The trail is clear! 🐆','Amazing! One step closer to camp! 🧭'][i%3]+' +10 คะแนน':'Keep exploring! You can learn from this. 🌱 +0 คะแนน')+'</strong>'+(!ok?'คุณเลือก <b>'+q.a[j]+'</b> แต่คำตอบคือ <b>'+q.word+'</b><br>':'คำตอบ <b>'+q.word+'</b> ถูกต้อง!<br>')+q.why+'</div><button class="next" onclick="next()">'+(i===9?'ดูผลการผจญภัย 🏆':i===4?'เข้าสู่ด่าน 2: แม่น้ำสายยาว 🛶':'Next mission →')+'</button>';}
function next(){if(!locked)return;i++;if(i<10)render();else finish()}
function finish(){const level=score>=90?'Jungle Grammar Master':score>=70?'Skilled Explorer':score>=50?'Growing Adventurer':'Brave Beginner';const msg=score>=90?'ยอดเยี่ยม! เลือกชนิดคำได้แม่นยำ รวมทั้งรูปพิเศษ well และ fast':score>=70?'ทำได้ดีมาก! ทบทวนข้อที่พลาดอีกนิด แล้วคุณจะพร้อมสำหรับภารกิจใหม่':score>=50?'คุณกำลังพัฒนาได้ดี! ลองมองหาคำนามหรือกริยาที่คำในช่องว่างไปขยาย': 'ขอบคุณที่ผจญภัยจนจบ! เริ่มฝึกจาก adjective ขยายนาม และ adverb ขยายกริยา แล้วลองใหม่ได้เสมอ';game.innerHTML='<div class="eyebrow">EXPEDITION COMPLETE</div><h2>You reached the camp! 🏕️</h2><div class="score">'+score+'<span style="font-size:24px"> / 100</span></div><h3>'+level+'</h3><p>'+msg+'</p><div class="rules">ด่าน 1: '+answers.slice(0,5).filter(a=>a.ok).length+' / 5 ข้อถูก<br>ด่าน 2: '+answers.slice(5).filter(a=>a.ok).length+' / 5 ข้อถูก<br>เกณฑ์เกม: 90–100 เชี่ยวชาญ • 70–80 คล่องขึ้น<br>50–60 กำลังพัฒนา • 0–40 เริ่มต้นอย่างกล้าหาญ<br><small>ผลนี้ประเมินเฉพาะทักษะในเกม ไม่ใช่การรับรองระดับ CEFR</small></div><button onclick="start()">Play again ↻</button><h3>Your expedition journal</h3>'+questions.map((q,k)=>'<div class="review">'+(answers[k].ok?'✅':'🌱')+' '+(k+1)+'. '+q.sentence.replace('___','<b>'+q.word+'</b>')+'<br>คุณตอบ: '+q.a[answers[k].j]+' • '+(answers[k].ok?10:0)+' คะแนน<br>'+q.why+'</div>').join('');}
document.addEventListener("click",e=>{if(e.target.closest("button"))tone(620,.06,.015)});
welcome();
</script></html>
